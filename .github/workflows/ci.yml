name: Validar y publicar GIATEP
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/ocr/package-lock.json
      - name: Instalar modelo OCR local en español
        working-directory: backend/ocr
        run: npm ci
      - name: Verificar reconocimiento local de imágenes
        working-directory: backend/ocr
        run: npm test
      - name: Pruebas de API, roles y negocio
        run: dotnet test backend/Giatep.Tests --logger 'trx;LogFileName=backend.trx' --results-directory evidencias
      - name: Instalar frontend
        working-directory: frontend
        run: npm ci
      - name: Compilar frontend
        working-directory: frontend
        run: npm run build
      - name: Publicar API
        run: dotnet publish backend/Giatep.Api -c Release -o entrega/api
      - name: Preparar interfaz y configuración de ejemplo
        run: |
          mkdir -p entrega/web
          cp -r frontend/dist/* entrega/web/
          cp README.md entrega/
          mkdir -p entrega/backend
          cp backend/.env.example entrega/backend/
          cp -r backend/ocr entrega/ocr
      - name: Publicar artefacto solo después de validación
        uses: actions/upload-artifact@v4
        with:
          name: giatep-validado
          path: entrega/
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas
          path: evidencias/*.trx
